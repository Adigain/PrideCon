[workspace]
resolver = "2"
members = [
    "crates/btp-algebra",
    "crates/btp-protocol",
    "crates/btp-attacks",
    "crates/btp-sim",
    "crates/btp-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# arkworks: keep every crate on 0.5.x (ark-ec 0.6 exists, but the curve crates are 0.5)
ark-ff = "0.5"
ark-ec = "0.5"
ark-std = "0.5"
ark-serialize = "0.5"
ark-bls12-381 = "0.5"

rand = "0.8"
rand_chacha = "0.3"
rand_distr = "0.4"
sha3 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
proptest = "1"

alloy = { version = "1", features = ["full"] }
alloy-sol-types = "1.7"
alloy-primitives = "1.7"
tokio = { version = "1", features = ["full"] }
eyre = "0.6"

btp-algebra = { path = "crates/btp-algebra" }
btp-protocol = { path = "crates/btp-protocol" }

[profile.release]
debug = 1

[profile.test]
opt-level = 2
