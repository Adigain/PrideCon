[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read", path = "../fixtures" }]
gas_limit = 1000000000
gas_reports = ["*"]

[lint]
# External calls are staticcalls to the EIP-2537 precompiles, and verification is all-or-nothing.
exclude_lints = ["calls-loop", "reentrancy-events", "require-revert-in-loop"]

